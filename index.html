<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sofía Sánchez · Arquitectura</title>
  <meta name="description" content="Portafolio de arquitectura de Sofía Sánchez: terminal de autobuses, mercado municipal, centro de convenciones, polideportivo y renovación de terraza en Caracas." />
  <meta property="og:title" content="Sofía Sánchez · Arquitectura" />
  <meta property="og:description" content="Portafolio de arquitectura: renders, planos y conceptos." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Aplica el tema guardado antes de pintar, para que no parpadee -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>

<body class="font-sans antialiased overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
